<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistikk – annonser</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--ink:#122e29;--lime:#dcf263;--gold:#f4c95d;--mist:#f2efe4;--soft:#5b6b64;
    --serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--mist);color:#1d312c;line-height:1.5;padding:24px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-family:var(--serif);font-size:1.7rem;color:var(--ink);margin-bottom:4px}
  .sub{color:var(--soft);font-size:.92rem;margin-bottom:26px}
  h2{font-family:var(--serif);font-size:1.25rem;color:var(--ink);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
  h2 .dot{width:12px;height:12px;border-radius:4px;background:var(--lime);border:1px solid var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #e3ded0;border-radius:14px;padding:16px}
  .card.total{background:var(--ink);border-color:var(--ink)}
  .card .n{font-family:var(--serif);font-size:1.9rem;font-weight:700;color:var(--ink)}
  .card.total .n{color:var(--lime)}
  .card .l{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin-top:2px}
  .card.total .l{color:#cfcaba}
  .foot{margin-top:30px;font-size:.82rem;color:var(--soft)}
  button{margin-top:14px;background:var(--lime);border:none;border-radius:99px;padding:10px 22px;font-weight:700;cursor:pointer;font-family:var(--sans)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Besøksstatistikk</h1>
  <div class="sub">Oppdateres automatisk hvert 30. sekund · sist hentet: <span id="tid">–</span></div>

  <h2><span class="dot"></span>Øy-annonsen – Litla Bjørnarøy</h2>
  <div class="grid" id="oy"></div>

  <h2><span class="dot"></span>Stillingsannonsen – Faginnredning</h2>
  <div class="grid" id="fag"></div>

  <button onclick="hent()">Oppdater nå</button>
  <p class="foot">Telleren teller én visning per besøksøkt. «Direkte» = lenke åpnet fra SMS/e-post/QR eller skrevet inn manuelt. Tall lagres hos counterapi.dev.</p>
</div>
<script>
const GRUPPER = {
  oy: { ns:'litla-bjornaroy-annonse', tellere:[
    ['sidevisninger','Totalvisninger',true],
    ['kilde-facebook','Facebook/Messenger'],['kilde-tiktok','TikTok'],['kilde-instagram','Instagram'],
    ['kilde-linkedin','LinkedIn'],['kilde-finn','FINN'],['kilde-direkte','Direkte'],['kilde-annet','Annet']
  ]},
  fag: { ns:'faginnredning-annonse', tellere:[
    ['sidevisninger','Totalvisninger',true],
    ['kilde-facebook','Facebook'],['kilde-linkedin','LinkedIn'],['kilde-direkte-qr','Direkte/QR'],['kilde-annet','Annet']
  ]}
};
async function tall(ns, key){
  // Prøver flere endepunkt-varianter og svarformater hos counterapi.dev
  const urls = [
    'https://api.counterapi.dev/v1/'+ns+'/'+key,
    'https://api.counterapi.dev/v1/'+ns+'/'+key+'/',
    'https://counterapi.dev/api/v1/'+ns+'/'+key
  ];
  for (const u of urls){
    try{
      const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      const v = j.count ?? j.value ?? (j.data && (j.data.count ?? j.data.up_count ?? j.data.value));
      if (typeof v === 'number') return v;
    }catch(e){}
  }
  return '–';
}
async function hent(){
  for (const [id,g] of Object.entries(GRUPPER)){
    const el = document.getElementById(id);
    const verdier = await Promise.all(g.tellere.map(t => tall(g.ns, t[0])));
    el.innerHTML = g.tellere.map((t,i) =>
      `<div class="card${t[2]?' total':''}"><div class="n">${verdier[i]}</div><div class="l">${t[1]}</div></div>`).join('');
  }
  document.getElementById('tid').textContent = new Date().toLocaleTimeString('no-NO');
}
hent();
setInterval(hent, 30000);
</script>
</body>
</html>
